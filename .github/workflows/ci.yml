name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: palmistry-path-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run content audit
        run: npm run content-audit

      - name: Run repository audits
        run: npm run audit:all

      - name: Run Relay merge-gate invariant self-test
        run: npm run relay:merge-gate:selftest

      - name: Run Corp Ops bounded-worker diagnostic self-test
        run: node scripts/corp-ops-worker-selftest.mjs
